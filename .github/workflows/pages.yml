name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "site/**"
      - "assets/logo.png"
      - "public/logo-mark.png"
      - "screenshots/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site/assets _site/screenshots
          cp site/index.html site/styles.css site/app.js _site/
          cp assets/logo.png _site/assets/
          cp public/logo-mark.png _site/assets/
          cp screenshots/sessions-screenshot.png _site/screenshots/
          cp screenshots/questions-screenshot.png _site/screenshots/
          cp screenshots/board-screenshot.png _site/screenshots/
          cp screenshots/sam-board.png _site/screenshots/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
